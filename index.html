/* ---------- TOP BAR ---------- */
.topbar{
  position:absolute; top:0; left:0; right:0;
  display:flex; align-items:flex-start; justify-content:space-between;
  padding:22px 28px;
  z-index:5;
  font-family:'Space Mono', monospace;
  letter-spacing:.03em;
}

.clock-plate{
  animation:fadeDown .7s ease both;
}
.clock-plate .time{
  font-size:18px; font-weight:700; color:var(--paper);
  text-shadow:0 2px 6px rgba(0,0,0,.6);
}

.route-ticker{
  display:flex; align-items:center; gap:8px;
  background:rgba(10,6,3,.38);
  border:1px solid rgba(230,196,84,.3);
  border-radius:999px;
  padding:6px 12px 6px 6px;
  backdrop-filter:blur(6px);
  animation:fadeDown .7s ease .1s both;
}
.route-badge{
  background:var(--gold-bright);
  color:#241505;
  font-weight:700;
  font-size:11px;
  width:22px; height:22px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}
.pulse-dot{
  width:7px; height:7px; border-radius:50%; background:#7de08a;
  box-shadow:0 0 0 0 rgba(125,224,138,.6);
  animation:pulse 2s infinite;
}

.links{
  display:flex; gap:8px;
  animation:fadeDown .7s ease .2s both;
}
.link-plaque{
  display:flex; align-items:center; justify-content:center;
  width:32px; height:32px;
  background:rgba(10,6,3,.38);
  border:1px solid rgba(230,196,84,.3);
  border-radius:50%;
  color:var(--paper);
  text-decoration:none;
  transition:background .2s ease, transform .2s ease;
}
.link-plaque:hover{ background:rgba(201,162,39,.28); transform:translateY(-1px); }
.link-plaque svg{ width:14px; height:14px; flex-shrink:0; }

/* ---------- HERO TEXT ---------- */
.hero{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center;
  z-index:4;
  padding-bottom:60px;
}
.headline{
  font-family:'Yatra One', cursive;
  font-size:clamp(72px, 13vw, 168px);
  line-height:1.02;
  color:#fdf6e3;
  text-shadow:0 6px 30px rgba(0,0,0,.55);
  opacity:0;
  animation:riseIn .9s ease .45s forwards;
}

/* ---------- TICKET PLAYER ---------- */
.yt-audio-host{
  position:absolute; width:1px; height:1px;
  overflow:hidden; opacity:0; pointer-events:none;
}

.ticket-wrap{
  position:absolute; left:50%; bottom:22px;
  transform:translateX(-50%) translateY(140%);
  z-index:6;
  animation:slideUp .8s cubic-bezier(.2,.8,.2,1) .9s forwards;
  width:min(360px, 88vw);
}

.ticket{
  position:relative;
  display:flex; align-items:center; gap:11px;
  background:rgba(20,13,6,.38);
  color:var(--paper);
  border-radius:28px;
  padding:8px 14px 8px 8px;
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.14);
}

.stub{
  flex-shrink:0;
  width:36px; height:36px;
  border-radius:50%;
  overflow:hidden;
  background:linear-gradient(150deg, var(--brick), var(--brick-deep));
  display:flex; align-items:center; justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);
}
.stub img{
  width:100%; height:100%; object-fit:cover;
  animation:spin 6s linear infinite;
  animation-play-state:paused;
}
.stub.spinning img{ animation-play-state:running; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.track-info{ flex:1; min-width:0; }
.track-title{
  font-family:'Yatra One', cursive;
  font-size:14px;
  color:var(--paper);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.progress-row{
  display:flex; align-items:center; gap:6px;
  margin-top:4px;
}
.progress-track{
  flex:1; height:2.5px; background:rgba(255,255,255,.2); border-radius:2px; overflow:hidden;
}
.progress-fill{
  height:100%; width:14%; background:var(--gold-bright); border-radius:2px;
  transition:width .25s linear;
}

.controls{ display:flex; align-items:center; gap:2px; flex-shrink:0; }
.ctrl-btn{
  background:none; border:none; cursor:pointer;
  color:var(--paper); opacity:.7;
  display:flex; align-items:center; justify-content:center;
  transition:opacity .15s ease;
}
.ctrl-btn:hover{ opacity:1; }
.ctrl-btn.play{
  width:30px; height:30px; border-radius:50%;
  background:rgba(255,255,255,.16); color:var(--paper); opacity:1;
}
.ctrl-btn.play:hover{ background:rgba(255,255,255,.26); }
.ctrl-btn svg{ width:14px; height:14px; }
.ctrl-btn.play svg{ width:13px; height:13px; }

/* ---------- ANIMATIONS ---------- */
@keyframes fadeDown{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }
@keyframes riseIn{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
@keyframes slideUp{ to{ transform:translateX(-50%) translateY(0); } }
@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(125,224,138,.55); }
  70%{ box-shadow:0 0 0 8px rgba(125,224,138,0); }
  100%{ box-shadow:0 0 0 0 rgba(125,224,138,0); }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
}

@media (max-width:640px){
  .headline{ font-size:clamp(48px, 15vw, 88px); }
  .topbar{ padding:16px 16px; flex-wrap:wrap; gap:10px; }
}
</style>
</head>
<body>

<div class="stage">
  <div class="bg"></div>
  <div class="grain"></div>

  <header class="topbar">
    <div class="clock-plate">
      <div class="time" id="clock">1:52 PM</div>
    </div>

    <div class="route-ticker">
      <span class="route-badge">84</span>
      <span class="pulse-dot"></span>
    </div>

    <div class="links">
      <a class="link-plaque" href="https://open.spotify.com" target="_blank" rel="noopener" aria-label="Spotify">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.59 14.4a.62.62 0 0 1-.85.21c-2.33-1.42-5.26-1.75-8.72-.96a.62.62 0 1 1-.28-1.21c3.78-.87 7.03-.49 9.64 1.1.3.18.4.57.21.86zm1.22-2.73a.78.78 0 0 1-1.07.26c-2.67-1.64-6.74-2.12-9.9-1.16a.78.78 0 1 1-.45-1.49c3.61-1.1 8.1-.56 11.16 1.32.37.23.49.72.26 1.07zm.1-2.85C14.66 8.9 9.4 8.72 6.3 9.68a.93.93 0 1 1-.56-1.78c3.56-1.08 9.38-.87 13.08 1.35a.93.93 0 1 1-.96 1.6z"/></svg>
      </a>
      <a class="link-plaque" href="https://music.youtube.com" target="_blank" rel="noopener" aria-label="YT Music">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2.2 14.5v-9l7 4.5-7 4.5z"/></svg>
      </a>
    </div>
  </header>

  <main class="hero">
    <h1 class="headline">बॉम्बे 1993</h1>
  </main>

  <div class="ticket-wrap">
    <div class="yt-audio-host" aria-hidden="true"></div>
    <div class="ticket">
      <div class="stub" id="albumStub"><img id="albumArt" src="" alt=""></div>
      <div class="track-info">
        <div class="track-title">तुझे देखा तो</div>
        <div class="progress-row">
          <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
        </div>
      </div>
      <div class="controls">
        <button class="ctrl-btn" id="prevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn play" id="playBtn" aria-label="Play">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// live clock
function tick(){
  const d = new Date();
  let h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h===0) h = 12;
  document.getElementById('clock').textContent = h + ':' + String(m).padStart(2,'0') + ' ' + ampm;
}
tick(); setInterval(tick, 15000);

// gentle "riders" counter flicker
const onlineEl = document.getElementById('onlineCount');
setInterval(()=>{
  const n = 138 + Math.floor(Math.random()*10);
  onlineEl.textContent = n + ' सवारी सवार';
}, 4000);

// ----- real playback via YouTube IFrame API, hidden host div -----
// (this is the exact pattern used by production sites: hidden div,
//  preloaded iframe_api script, player created into that div, custom UI drives it)
const tracks = [
  { title: 'ये है बॉम्बे मेरी जान', sub: 'C.I.D. · 1956', id: 'HlAOZrst6fQ' },
  { title: 'किसका रास्ता देखे', sub: 'Joshila · 1973', id: 'E0PBNCDACCU' },
  { title: 'मेरे सपनों की रानी', sub: 'Aradhana · 1969', id: '9PdSmDRGIwM' },
  { title: 'प्यार हुआ इक़रार हुआ', sub: 'Shree 420 · 1955', id: 'xkl1QwNEuYs' }
];
let trackIndex = 0;
let playing = false;
let ytPlayer = null;
let ytReady = false;
let pendingPlay = false;
let progTimer = null;

const fill = document.getElementById('progFill');
const playIcon = document.getElementById('playIcon');
const titleEl = document.querySelector('.track-title');
const albumArt = document.getElementById('albumArt');
const albumStub = document.getElementById('albumStub');
const hostDiv = document.querySelector('.yt-audio-host');

function currentTrack(){ return tracks[trackIndex]; }

function loadTrackInfo(){
  albumArt.src = 'https://i.ytimg.com/vi/' + currentTrack().id + '/hqdefault.jpg';
  titleEl.textContent = currentTrack().title;
  fill.style.width = '0%';
}
loadTrackInfo();

// build the div the player will mount into, then load the API script
const mountEl = document.createElement('div');
mountEl.id = 'ytPlayerMount';
hostDiv.appendChild(mountEl);

const ytScript = document.createElement('script');
ytScript.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(ytScript);

window.onYouTubeIframeAPIReady = function(){
  ytPlayer = new YT.Player('ytPlayerMount', {
    height: '200', width: '200',
    videoId: currentTrack().id,
    playerVars: { controls: 0, disablekb: 1, modestbranding: 1, playsinline: 1, origin: window.location.origin },
    events: {
      onReady: ()=>{
        ytReady = true;
        if(pendingPlay){ pendingPlay = false; setPlaying(true); }
      },
      onStateChange: onPlayerStateChange,
      onError: onPlayerError
    }
  });
};

function onPlayerError(e){
  playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  playing = false;
  albumStub.classList.remove('spinning');
  clearInterval(progTimer);
  window.open('https://www.youtube.com/watch?v=' + currentTrack().id, '_blank');
}

function onPlayerStateChange(e){
  if(e.data === YT.PlayerState.ENDED){
    changeTrack(1, true);
  }
}

function setPlaying(state){
  playing = state;
  if(!ytReady){
    if(state){ pendingPlay = true; }
    return;
  }
  if(state){
    playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>';
    albumStub.classList.add('spinning');
    ytPlayer.playVideo();
    clearInterval(progTimer);
    progTimer = setInterval(()=>{
      const dur = ytPlayer.getDuration();
      const cur = ytPlayer.getCurrentTime();
      if(dur > 0){ fill.style.width = (cur/dur*100) + '%'; }
    }, 400);
  } else {
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    albumStub.classList.remove('spinning');
    ytPlayer.pauseVideo();
    clearInterval(progTimer);
  }
}

function changeTrack(dir, autoplay){
  trackIndex = (trackIndex + dir + tracks.length) % tracks.length;
  loadTrackInfo();
  const shouldPlay = playing || autoplay;
  if(ytReady){ ytPlayer.loadVideoById(currentTrack().id); }
  playing = false;
  setPlaying(shouldPlay);
}

document.getElementById('playBtn').addEventListener('click', ()=> setPlaying(!playing));
document.getElementById('nextBtn').addEventListener('click', ()=> changeTrack(1));
document.getElementById('prevBtn').addEventListener('click', ()=> changeTrack(-1));
</script>

</body>
</html>
